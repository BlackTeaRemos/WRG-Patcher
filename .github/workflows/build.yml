name: build

on:
  push:
    branches: [ current, main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ current, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile version.dll (release)
        shell: cmd
        run: |
          cl /nologo /O2 /LD /EHsc /std:c++latest /D_CRT_SECURE_NO_WARNINGS /DWRG_RELEASE /I include ^
             src\patcher.cpp src\hook.cpp src\redirect.cpp src\overlay.cpp src\overlay_load.cpp ^
             src\manifest.cpp src\edat.cpp src\version_gate.cpp src\plugin.cpp src\ipc.cpp ^
             src\version_shim.cpp /Fe:version.dll /link /OUT:version.dll
          if errorlevel 1 exit /b 1

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path version.dll)) { throw "version.dll not produced" }
          Get-Item version.dll | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: version-dll
          path: version.dll
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for install script)
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: version-dll

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            version.dll
            tools/install.bat
          generate_release_notes: true
